name: Build AX9000
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ax9000-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TZ: Asia/Singapore
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect runner disk
        run: |
          date -Is
          df -h
          nproc
          free -h
      - name: Free runner disk with bounded cleanup
        timeout-minutes: 4
        run: |
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            echo "[$(date -Is)] Removing optional runner tools: $path"
            timeout 40s sudo rm -rf "$path" || echo "Cleanup timed out for $path; continuing"
          done
          df -h
      # Copied from the Arthur build. Run 44512160600 drew a runner whose
      # us-east-2.ec2.archive.ubuntu.com mirror served ~50 kB/s and apt-get install
      # hit its 420 s timeout; probe a few mirrors and point apt at the fastest.
      - name: Select a responsive Ubuntu mirror
        timeout-minutes: 3
        run: |
          best_url='https://archive.ubuntu.com/ubuntu'
          best_speed=0
          # Mirrors outside ubuntu.com are fallbacks for runners that cannot reach *.ubuntu.com.
          for base in https://archive.ubuntu.com/ubuntu https://azure.archive.ubuntu.com/ubuntu http://azure.archive.ubuntu.com/ubuntu \
              https://mirrors.edge.kernel.org/ubuntu https://mirrors.mit.edu/ubuntu; do
            result=$(curl -L -s --connect-timeout 5 --max-time 15 -o /tmp/ax9000-ubuntu-release -w '%{http_code} %{speed_download}' "$base/dists/noble-updates/Release" || true)
            echo "Ubuntu mirror probe: $base -> $result bytes/sec"
            read -r code speed <<< "$result"
            speed=${speed%%.*}
            if [[ "$code" = 200 && "${speed:-0}" -gt "$best_speed" ]]; then
              best_url=$base
              best_speed=$speed
            fi
          done
          echo "Selected Ubuntu mirror: $best_url"
          sudo python3 - "$best_url" <<'PY'
          from pathlib import Path
          import sys
          base = sys.argv[1]
          paths = [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text()
              for old in ['http://azure.archive.ubuntu.com/ubuntu', 'https://azure.archive.ubuntu.com/ubuntu', 'http://archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu',
                          'http://security.ubuntu.com/ubuntu', 'https://security.ubuntu.com/ubuntu']:
                  text = text.replace(old, base)
              path.write_text(text)
          # Runner images point the Ubuntu sources at mirror+file:/etc/apt/apt-mirrors.txt.
          mirrors = Path('/etc/apt/apt-mirrors.txt')
          if mirrors.exists():
              print('Previous apt mirror list:\n' + mirrors.read_text())
              mirrors.write_text(base + '/\n')
          PY
      - name: Update apt package indexes
        timeout-minutes: 4
        run: timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
      - name: Install build dependencies
        timeout-minutes: 8
        run: |
          timeout 420s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Use-Pty=0 install --no-install-recommends -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            xsltproc libelf-dev device-tree-compiler zstd ccache ninja-build pkgconf texinfo libtool-bin \
            libzstd-dev gperf libfuse-dev
          df -h
      # The seed sets CONFIG_CCACHE with an empty CONFIG_CCACHE_DIR, so OpenWrt
      # uses source/.ccache -- cache that path, not a CCACHE_DIR env var (rules.mk
      # overrides it). The source and feeds follow their branches, so the key is just the run id:
      # every run saves a fresh cache and restores the newest one.
      - name: Restore source download and compiler caches
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            source/dl
            source/.ccache
          key: ax9000-viking-${{ github.run_id }}
          restore-keys: |
            ax9000-viking-
      - name: Fetch source, configure feeds and verify the configuration
        run: bash scripts/prepare.sh
      # Host tools and the cross toolchain took ~27 of the 57 compile minutes in
      # run 46126596272 and ccache barely helps there: cmake bootstraps itself
      # with HOSTCC_NOCACHE (ccache is built with cmake), gcc builds its runtime
      # with the xgcc it just made. Cache the installed results instead, keyed
      # on the source trees and config symbols they are built from.
      - name: Key the host tools and toolchain cache
        id: toolchain-key
        working-directory: source
        run: |
          trees=$(git rev-parse HEAD:tools HEAD:toolchain HEAD:include HEAD:scripts HEAD:rules.mk HEAD:Makefile \
            HEAD:target/linux/qualcommax/Makefile | sha256sum | cut -c1-16)
          config=$(grep -E '^CONFIG_(TARGET_|ARCH|GCC|BINUTILS|LIBC|MUSL|EXTERNAL|TOOLCHAIN|GDB|USE_|SSP|PKG_|DEVEL|CCACHE|BUILD_|HOST)' .config \
            | sort | sha256sum | cut -c1-16)
          echo "key=ax9000-toolchain-$trees-$config" >> "$GITHUB_OUTPUT"
      - name: Restore host tools and toolchain
        id: toolchain-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            source/staging_dir/host
            source/staging_dir/toolchain-*
          key: ${{ steps.toolchain-key.outputs.key }}
      # make re-enters tools/ or toolchain/ when a file there is newer than the
      # top stamp, and timestamp.pl counts an equal mtime as older. Every stamp
      # gets time T and the two top stamps T+2 (toolchain's depends on
      # .gcc_final_installed); build_dir is not cached, so re-entering would
      # rebuild everything.
      - name: Mark the restored host tools and toolchain newer than the checkout
        if: steps.toolchain-cache.outputs.cache-hit == 'true'
        working-directory: source
        run: |
          t=$(date +%s)
          find staging_dir/host/stamp staging_dir/toolchain-*/stamp -type f -exec touch -d "@$t" {} +
          touch -d "@$((t + 2))" staging_dir/host/stamp/.tools_compile_* staging_dir/toolchain-*/stamp/.toolchain_compile
          ls -la --time-style=+%T staging_dir/host/stamp/.tools_compile_* staging_dir/toolchain-*/stamp/
      - name: Download source archives
        working-directory: source
        run: |
          set -o pipefail
          make download -j8 V=s 2>&1 | tee ../artifacts/download.log
      - name: Compile AX9000 firmware
        id: compile
        working-directory: source
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../artifacts/build.log || \
            make -j1 V=s 2>&1 | tee ../artifacts/build-serial.log
      - name: Save source download and compiler caches
        if: always() && steps.compile.outcome != 'skipped'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            source/dl
            source/.ccache
          key: ax9000-viking-${{ github.run_id }}
      - name: Save host tools and toolchain
        if: steps.compile.outcome == 'success' && steps.toolchain-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            source/staging_dir/host
            source/staging_dir/toolchain-*
          key: ${{ steps.toolchain-key.outputs.key }}
      - name: Size of each package in the rootfs
        if: always() && steps.compile.outcome == 'success'
        run: python3 scripts/sizes.py "$GITHUB_WORKSPACE"
      - name: Audit packages, ath11k fix and stock slot size; collect firmware
        run: python3 scripts/verify.py images "$GITHUB_WORKSPACE"
      - name: Check the image formats offline (UBI geometry, FIT device tree, sysupgrade metadata)
        run: |
          pip install --user --break-system-packages fdt==0.3.3 ubi_reader==0.8.16
          python3 scripts/verify_images.py artifacts/firmware
      - name: Archive matching kernel modules and packages
        run: tar -I 'zstd -T0 -3' -cf artifacts/matching-packages.tar.zst -C source/bin packages targets/qualcommax/ipq807x/packages
      - name: Save diagnostics even on failure
        if: always()
        run: |
          mkdir -p artifacts
          test ! -f source/.config || cp source/.config artifacts/config.resolved
          test ! -d source/logs || tar -czf artifacts/openwrt-logs.tar.gz -C source logs
          (command -v ccache >/dev/null && CCACHE_DIR=source/.ccache ccache -s) > artifacts/ccache-stats.txt 2>&1 || true
          df -h > artifacts/runner-disk.txt
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ax9000-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 2
          if-no-files-found: error
